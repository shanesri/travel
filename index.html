<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Travel — Shane &amp; Poon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Noto+Serif+Thai:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="travel.css">
<style>
.big{max-width:1100px}
.intro{padding:48px 0 4px}
.intro h1{font-size:clamp(52px,12vw,96px);font-style:italic;font-weight:500}
.intro p{font-size:18px;max-width:560px;color:var(--soft);margin:10px 0 0}
/* year block */
.year{margin-top:4px}
.yhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;border-bottom:1px solid var(--line);padding-bottom:10px}
.yhead h3{font-size:clamp(40px,8vw,60px);font-style:italic;font-weight:500;line-height:1}
.yhead .sum{font-size:15px;color:var(--soft)}
.yhead .sum b{color:var(--ink);font-weight:600}
.ybar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:12px;background:var(--line)}
.ybar span{display:block;height:100%}
.ylegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--soft);margin-top:6px}
.ylegend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:18px}
.trip{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .15s,box-shadow .15s}
a.trip:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(60,40,20,.10)}
.trip .pic{position:relative;aspect-ratio:4/3;background:#ddd}
.trip .pic img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:12px;top:12px;background:rgba(255,253,248,.92);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
.badge:empty{display:none}
.flag{position:absolute;right:12px;top:12px;background:rgba(35,32,28,.75);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
.trip .meta{padding:16px 18px 18px}
.when{font-size:13px;color:var(--soft)}
.trip h4{font-family:var(--serif);font-size:26px;font-style:italic;font-weight:500;margin:2px 0;line-height:1.2}
.place{font-size:15px}
.tags{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.tags li{font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.foot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.price{font-family:var(--serif);font-size:20px;font-weight:600}
.st{font-size:12px;color:var(--soft);text-align:right}
.past .pic img{filter:saturate(.8)}
.idea .pic{position:relative;aspect-ratio:16/9;background:#ddd}.idea .pic img{width:100%;height:100%;object-fit:cover}
.idea .note{font-size:14px;color:var(--ink);margin:8px 0 0;line-height:1.6}
.idea .peak{font-size:14px;color:var(--accent);margin-top:8px;font-weight:500}
.idea .cred{display:block;font-size:11px;color:var(--soft);margin-top:8px;text-decoration:none}
.idea h4{font-size:24px}
details.grp{border-top:1px solid var(--line);margin-top:28px}
details.grp:first-child{margin-top:44px}
details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:18px 0 6px;user-select:none}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary h3{font-size:clamp(34px,7vw,52px);font-style:italic;font-weight:500;line-height:1;margin:0}
details.grp>summary .cnt{color:var(--soft);font-size:18px}
details.grp>summary .arr{margin-left:auto;color:var(--accent);font-size:22px;line-height:1}
details.grp>summary .arr::before{content:"▸"}
details.grp[open]>summary .arr::before{content:"▾"}
details.grp>summary .sub{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
details.grp>.gbody{padding-bottom:8px}
.sec-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.sort{display:flex;gap:6px;flex-wrap:wrap}
.sort button{font:inherit;font-size:13px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.sort button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sort button span{font-weight:600}
/* someday timeline */
.tl{margin-top:16px}
.tl-hint{font-size:13px;color:var(--soft);margin:0 0 10px}
.tl-row{display:grid;grid-template-columns:minmax(118px,1.4fr) repeat(12,minmax(0,1fr));align-items:center;column-gap:2px}
.tl-head{position:sticky;top:0;background:var(--paper);z-index:2;padding:4px 0 6px;border-bottom:1px solid var(--line)}
.tl-head button{font:inherit;font-size:12px;line-height:1.2;padding:4px 0;border:1px solid transparent;border-radius:8px;background:none;color:var(--ink);cursor:pointer;text-align:center}
.tl-head button small{display:block;font-size:10px;color:var(--soft)}
.tl-head button.on{background:var(--ink);color:var(--paper)}.tl-head button.on small{color:var(--paper)}
.tl-head .all{font-size:12px;color:var(--accent);text-align:left;padding-left:0}
.tl-plan>*{min-width:0}.tl-plan{font-size:10px;color:var(--soft);padding:4px 0;border-bottom:1px solid var(--line)}
.tl-plan>span:first-child{font-size:11px}
.tl-plan i{display:block;font-style:normal;font-size:9px;background:var(--accent);color:#fff;border-radius:4px;padding:1px 2px;margin:1px 0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-trip{padding:5px 0;border-bottom:1px solid var(--line)}
.tl-trip a{color:var(--ink);text-decoration:none;font-size:13px;line-height:1.25;display:block;padding-right:6px}
.tl-trip a small{display:block;color:var(--soft);font-size:11px}
.tl-trip a:hover b{text-decoration:underline}
.tl-trip b{font-weight:500}
.tl-c{height:14px;border-radius:2px}
.tl-c.on{background:var(--accent);opacity:.75}
.tl-c.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.tl-col{background:rgba(120,100,70,.07)}
.tl-sum{font-size:14px;margin:0 0 10px}
.tl-sum b{font-weight:600}
@media(max-width:480px){.tl-row{grid-template-columns:104px repeat(12,1fr)}.tl-head button{font-size:10px}.tl-trip a{font-size:12px}}
a.idea{text-decoration:none;color:inherit}
.idea .cred{pointer-events:none}

.sec{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:60px 0 0}
.empty{color:var(--soft);font-size:15px;border:1px dashed var(--line);border-radius:18px;padding:22px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<nav class="top"><a class="brand" href="https://www.shanesri.com">shanesri</a><span class="muted">Travel</span></nav>
<main class="wrap big">
<section class="intro">
  <div class="kicker">Shane &amp; Poon</div>
  <h1>Travel</h1>
  <p>แพลนเที่ยวแต่ละปี เปิดดูตอนเดินทาง หรือลอกรูทไปเที่ยวตามได้เลย</p>
</section>

<div id="groups"></div>
<template id="sd-body"><div class="sec-row"><p class="muted" style="margin:0">อยากไป แต่ยังไม่ลงปี · งบเป็นสองคน All-in โดยประมาณ</p><div class="sort" id="sort" role="group" aria-label="เรียงลำดับ"><button type="button" data-k="def" class="on">ค่าเริ่มต้น</button><button type="button" data-k="budgetMin">เรียงตามงบ <span></span></button><button type="button" data-k="tl">📅 ไทม์ไลน์</button></div></div>
<div class="grid" id="someday"></div></template>

<noscript><p>เปิด JavaScript เพื่อดูรายการทริป</p></noscript>
<footer>ภาพจาก Wikimedia Commons (เครดิตอยู่ในหน้าแต่ละทริป) · หน้านี้ไม่ได้เปิดให้ Google ค้นเจอ · เพิ่มทริปใหม่ได้ที่ไฟล์ trips.js</footer>
</main>
<script src="trips.js"></script>
<script>
(function(){
const TODAY=Date.now();
const d=s=>new Date(s+'T00:00:00+07:00').getTime();
const trips=window.TRIPS.slice().sort((a,b)=>d(a.start)-d(b.start));
const isPast=t=>d(t.end)+864e5<TODAY;
const fmtK=n=>'~'+Math.round(n/1000)+'k';
const COL=['#A8322A','#1F5E8C','#2E7D78','#3F6B3A','#B8862B','#6B4E8C','#8C5A2E','#2F4A6D'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function cdText(t){const n=Math.ceil((d(t.start)-TODAY)/864e5);if(n>1)return 'อีก '+n+' วัน';if(n===1)return 'พรุ่งนี้!';if(!isPast(t))return 'กำลังเที่ยว';return '';}
function card(t){const past=isPast(t);
  return `<a class="trip${past?' past':''}" href="${t.slug}/">
  <div class="pic"><img loading="lazy" src="${t.img}" alt=""><span class="badge">${past?'':esc(cdText(t))}</span><span class="flag">${esc(t.country)}</span></div>
  <div class="meta"><div class="when">${esc(t.when)} · ${t.days} วัน</div><h4>${esc(t.name)}</h4><div class="place">${esc(t.place)}</div>
  <ul class="tags">${t.tags.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  <div class="foot"><span class="price">${esc(t.price)}</span><span class="st">${past?'ไปมาแล้ว':esc(t.status||'')}</span></div></div></a>`;}
function yearBlock(y,list,all){
  const yl=all.filter(t=>t.year===y);const cost=yl.reduce((a,t)=>a+t.cost,0),days=yl.reduce((a,t)=>a+t.days,0);
  const countries=[...new Set(yl.map(t=>t.country))].length;
  const bar=yl.map((t,i)=>`<span style="width:${t.cost/cost*100}%;background:${COL[i%COL.length]}" title="${esc(t.name)}"></span>`).join('');
  const leg=yl.map((t,i)=>`<span><i style="background:${COL[i%COL.length]}"></i>${esc(t.name)} ${fmtK(t.cost)}</span>`).join('');
  return `<section class="year" data-year="${y}"><div class="yhead"><div class="sum"><b>${yl.length}</b> ทริป · <b>${days}</b> วัน · <b>${countries}</b> ประเทศ · งบ <b>${fmtK(cost)} ฿</b> สองคน</div></div>
  <div class="ybar">${bar}</div><div class="ylegend">${leg}</div>
  <div class="grid">${list.map(card).join('')}</div></section>`;}
const done=trips.filter(isPast).sort((x,y)=>d(y.start)-d(x.start));
const up=trips.filter(t=>!isPast(t));
const upYears=[...new Set(up.map(t=>t.year))].sort();
const CY=new Date().getFullYear();
const openYear=upYears.includes(CY)?CY:upYears[0];
const grp=(id,title,sub,n,body,open)=>`<details class="grp" id="${id}"${open?' open':''}><summary><h3>${esc(title)}</h3><span class="cnt">(${n})</span>${sub?`<span class="sub">${esc(sub)}</span>`:''}<span class="arr" aria-hidden="true"></span></summary><div class="gbody">${body}</div></details>`;
let html=upYears.map(y=>{const l=up.filter(t=>t.year===y);return grp('y'+y,String(y),'Upcoming',l.length,yearBlock(y,l,trips),y===openYear)}).join('');
html+=grp('previous','Previous','',done.length,done.length?`<div class="grid">${done.map(card).join('')}</div>`:'<p class="empty">ยังไม่มีทริปที่ไปมาแล้ว</p>',false);
html+=grp('someday-g','Someday','',window.SOMEDAY.length,document.getElementById('sd-body').innerHTML,false);
document.getElementById('groups').innerHTML=html;
// someday
const SD=window.SOMEDAY.map((x,i)=>({...x,_i:i}));
const sdCard=x=>`<a class="trip idea" href="${x.slug}/"><div class="pic"><img loading="lazy" src="${x.img}" alt=""><span class="flag">${esc(x.country)}</span></div><div class="meta"><div class="when">${esc(x.days)}</div><h4>${esc(x.name)}</h4><p class="note">${esc(x.note)}</p><div class="peak">🗓 ช่วงพีค: ${esc(x.peak)}</div><div class="foot"><span class="price">${esc(x.price)}</span><span class="st">สองคน</span></div><span class="cred">ภาพ: ${esc(x.credit)} · Wikimedia Commons</span></div></a>`;
let sk='def',dir=1,selM=0;
const MN=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
// months already taken by upcoming dated trips
const planned=Array.from({length:13},()=>[]);
up.forEach(t=>{const a=new Date(t.start+'T00:00:00'),b=new Date((t.end||t.start)+'T00:00:00');const seen=new Set();
  for(let x=new Date(a.getFullYear(),a.getMonth(),1);x<=b;x.setMonth(x.getMonth()+1)){const m=x.getMonth()+1;if(seen.has(m))continue;seen.add(m);planned[m].push({n:t.name,c:t.country,y:x.getFullYear()});}});
const seasonStart=x=>{const ms=x.months||[];if(ms.length>=12)return 0;for(const m of ms){const p=m===1?12:m-1;if(!ms.includes(p))return m;}return ms[0]||13;};
function drawTL(){
  const el=document.getElementById('someday');el.className='tl';
  let l=SD.filter(x=>!selM||(x.months||[]).includes(selM));
  l.sort(selM?(a,b)=>a.budgetMin-b.budgetMin:(a,b)=>seasonStart(a)-seasonStart(b)||a.daysMin-b.daysMin);
  const cnt=m=>SD.filter(x=>(x.months||[]).includes(m)).length;
  let h=`<p class="tl-hint">แถบสี = ช่วงที่เหมาะจะไป · แตะชื่อเดือนเพื่อดูว่าเดือนนั้นไปทริปไหนได้ · แถวบนสุดคือเดือนที่มีทริปลงแพลนแล้ว</p>`;
  if(selM){const pl=planned[selM];h+=`<p class="tl-sum"><b>${MN[selM-1]}</b> ไปได้ ${l.length} ทริป (เรียงงบน้อย → มาก)${pl.length?` · แพลนแล้ว: ${pl.map(p=>esc(p.n)+' ('+esc(p.c)+' '+p.y+')').join(', ')}`:' · ยังว่าง'}</p>`;}
  h+=`<div class="tl-row tl-head"><button type="button" class="all" data-m="0">${selM?'← ทุกเดือน':'เดือน'}</button>${MN.map((n,i)=>`<button type="button" data-m="${i+1}" class="${selM===i+1?'on':''}" aria-pressed="${selM===i+1}">${n.replace('.','').replace('.','')}<small>${cnt(i+1)}</small></button>`).join('')}</div>`;
  h+=`<div class="tl-row tl-plan"><span>แพลนแล้ว</span>${MN.map((n,i)=>`<span class="${selM===i+1?'tl-col':''}">${planned[i+1].map(p=>`<i title="${esc(p.n)} · ${esc(p.c)} ${p.y}">${esc(p.c)} ’${String(p.y).slice(2)}</i>`).join('')}</span>`).join('')}</div>`;
  h+=l.map(x=>{const ms=x.months||[];return `<div class="tl-row tl-trip"><a href="${x.slug}/"><b>${esc(x.name.split(' · ')[0])}</b><small>${esc(x.days)} · ${fmtK(x.budgetMin)}</small></a>${MN.map((n,i)=>`<span class="tl-c${ms.includes(i+1)?' on':''}${selM===i+1?' tl-col':''}" title="${n}"></span>`).join('')}</div>`;}).join('');
  el.innerHTML=h;
  el.querySelectorAll('.tl-head button').forEach(b=>b.addEventListener('click',()=>{const m=+b.dataset.m;selM=(m===selM)?0:m;drawTL();}));}
function drawSD(){
  document.querySelectorAll('#sort button').forEach(b=>{const on=b.dataset.k===sk;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);const s=b.querySelector('span');if(s)s.textContent=on?(dir>0?'↑':'↓'):'';});
  if(sk==='tl')return drawTL();
  const el=document.getElementById('someday');el.className='grid';
  const l=[...SD].sort(sk==='def'?(a,b)=>a._i-b._i:(a,b)=>(a[sk]-b[sk])*dir||a._i-b._i);
  el.innerHTML=l.map(sdCard).join('');}
document.querySelectorAll('#sort button').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k;if(k===sk&&k!=='def'&&k!=='tl')dir=-dir;else{sk=k;dir=1}drawSD();}));
drawSD();
})();
</script>
</body></html>
